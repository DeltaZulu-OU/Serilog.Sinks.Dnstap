name: DNSTap benchmarks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/benchmarks.yml
  workflow_dispatch:
    inputs:
      records:
        description: "Records per run"
        required: true
        default: "20000"
      batch_size:
        description: "Records per batch"
        required: true
        default: "128"

permissions:
  contents: read
  packages: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        env:
          NuGetPackageSourceCredentials_deltazulu-github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
        run: dotnet restore benchmarks/Serilog.Sinks.Dnstap.Benchmarks/Serilog.Sinks.Dnstap.Benchmarks.csproj --configfile NuGet.Config --locked-mode
      - name: Build
        run: dotnet build benchmarks/Serilog.Sinks.Dnstap.Benchmarks/Serilog.Sinks.Dnstap.Benchmarks.csproj -c Release --no-restore
      - name: Measure file and TCP
        shell: bash
        env:
          RECORDS: ${{ inputs.records || '20000' }}
          BATCH_SIZE: ${{ inputs.batch_size || '128' }}
        run: |
          set -euo pipefail
          [[ "$RECORDS" =~ ^[0-9]+$ ]] && (( RECORDS >= 1 && RECORDS <= 1000000 ))
          [[ "$BATCH_SIZE" =~ ^[0-9]+$ ]] && (( BATCH_SIZE >= 1 && BATCH_SIZE <= 10000 ))
          dotnet --version | tee benchmark-environment.txt
          uname -a | tee -a benchmark-environment.txt
          for repeat in 1 2 3; do
            echo "repeat=$repeat" | tee -a tcp-results.txt
            dotnet run --project benchmarks/Serilog.Sinks.Dnstap.Benchmarks -c Release --no-build --no-restore -- tcp "$RECORDS" "$BATCH_SIZE" | tee -a tcp-results.txt
          done
          dotnet run --project benchmarks/Serilog.Sinks.Dnstap.Benchmarks -c Release --no-build --no-restore -- file "$RECORDS" "$BATCH_SIZE" | tee file-results.txt
      - name: Preserve results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: |
            file-results.txt
            tcp-results.txt
            benchmark-environment.txt
          if-no-files-found: error
