name: Bootstrap NuGet lock files

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lock-dependencies.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  lock-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NuGetPackageSourceCredentials_deltazulu-github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Generate library, test and benchmark lock files
        run: |
          dotnet restore Serilog.Sinks.Dnstap.slnx --configfile NuGet.Config --use-lock-file
          dotnet restore benchmarks/Serilog.Sinks.Dnstap.Benchmarks/Serilog.Sinks.Dnstap.Benchmarks.csproj --configfile NuGet.Config --use-lock-file
      - name: Verify locked restore
        run: |
          dotnet restore Serilog.Sinks.Dnstap.slnx --configfile NuGet.Config --locked-mode
          dotnet restore benchmarks/Serilog.Sinks.Dnstap.Benchmarks/Serilog.Sinks.Dnstap.Benchmarks.csproj --configfile NuGet.Config --locked-mode
      - name: Display resolved dependency locks for signed repository commit
        run: |
          for path in src/Serilog.Sinks.Dnstap/packages.lock.json tests/Serilog.Sinks.Dnstap.Tests/packages.lock.json benchmarks/Serilog.Sinks.Dnstap.Benchmarks/packages.lock.json; do
            echo "DNSTAP_LOCK_BEGIN:$path"
            cat "$path"
            echo "DNSTAP_LOCK_END:$path"
          done
      - name: Preserve resolved dependencies
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-nuget-locks
          path: |
            src/Serilog.Sinks.Dnstap/packages.lock.json
            tests/Serilog.Sinks.Dnstap.Tests/packages.lock.json
            benchmarks/Serilog.Sinks.Dnstap.Benchmarks/packages.lock.json
          if-no-files-found: error
