name: Unit Tests

on:
  push:
    branches: [main, "feature/**"]
    # Skip Markdown-only changes; mixed source/config changes still run CI.
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore with authenticated DeltaZulu GitHub Packages feed
        env:
          NuGetPackageSourceCredentials_deltazulu-github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
        run: dotnet restore Serilog.Sinks.Dnstap.slnx --configfile NuGet.Config --locked-mode
      - name: Build
        run: dotnet build Serilog.Sinks.Dnstap.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/Serilog.Sinks.Dnstap.Tests/Serilog.Sinks.Dnstap.Tests.csproj -c Release --no-build --no-restore
      - name: Verify NuGet package can be built
        run: dotnet pack src/Serilog.Sinks.Dnstap/Serilog.Sinks.Dnstap.csproj -c Release --no-build --no-restore --output artifacts

  package-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NuGetPackageSourceCredentials_deltazulu-github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.6"
      - name: Build validated NuGet candidate
        run: |
          dotnet restore src/Serilog.Sinks.Dnstap/Serilog.Sinks.Dnstap.csproj --configfile NuGet.Config --locked-mode
          dotnet pack src/Serilog.Sinks.Dnstap/Serilog.Sinks.Dnstap.csproj -c Release --no-restore --output artifacts/packages /p:RepositoryCommit=${{ github.sha }}
      - name: Validate NuGet metadata and dependencies
        run: python3 .github/scripts/verify-nupkg.py artifacts/packages/Serilog.Sinks.Dnstap.*.nupkg
      - name: Restore isolated consumer from local candidate
        run: dotnet restore tests/PackageConsumer/PackageConsumer.csproj --configfile tests/PackageConsumer/NuGet.Config --packages "${{ runner.temp }}/package-consumer-cache" --no-http-cache
      - name: Install independent Go dnstap reader
        run: GOBIN="${{ runner.temp }}/dnstap-tools" go install github.com/dnstap/golang-dnstap/dnstap@ebb538e7d351a58861a8f348491828214a1d8db2
      - name: Verify file output with independent decoder
        run: |
          set -euo pipefail
          dotnet run --project tests/PackageConsumer/PackageConsumer.csproj -c Release --no-restore -- file "${{ runner.temp }}/sink.fstrm"
          "${{ runner.temp }}/dnstap-tools/dnstap" -j -r "${{ runner.temp }}/sink.fstrm" > "${{ runner.temp }}/file.jsonl"
          jq -s -e 'length == 1 and .[0].type == "MESSAGE" and .[0].identity == "serilog-dnstap-consumer" and .[0].message.type == "CLIENT_QUERY" and .[0].message.socket_protocol == "UDP" and .[0].message.query_address == "192.0.2.10" and .[0].message.response_port == 53 and (.[0].message.query_message | contains("example.com."))' "${{ runner.temp }}/file.jsonl"
      - name: Verify TCP output with independent receiver
        run: |
          set -euo pipefail
          "${{ runner.temp }}/dnstap-tools/dnstap" -j -l 127.0.0.1:16054 > "${{ runner.temp }}/tcp.jsonl" 2> "${{ runner.temp }}/tcp.stderr" &
          reader=$!
          trap 'kill "$reader" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..100}; do
            if ss -ltn | grep -qE ':16054[[:space:]]'; then ready=1; break; fi
            kill -0 "$reader" || { cat "${{ runner.temp }}/tcp.stderr"; exit 1; }
            sleep 0.1
          done
          [[ "$ready" -eq 1 ]]
          dotnet run --project tests/PackageConsumer/PackageConsumer.csproj -c Release --no-restore -- tcp 127.0.0.1 16054
          for i in {1..100}; do
            if [[ "$(wc -l < "${{ runner.temp }}/tcp.jsonl")" -ge 1 ]]; then break; fi
            sleep 0.1
          done
          jq -s -e 'length == 1 and .[0].type == "MESSAGE" and .[0].identity == "serilog-dnstap-consumer" and .[0].message.type == "CLIENT_QUERY" and .[0].message.socket_protocol == "UDP" and .[0].message.query_address == "192.0.2.10" and .[0].message.response_port == 53 and (.[0].message.query_message | contains("example.com."))' "${{ runner.temp }}/tcp.jsonl"
      - name: Preserve independent interoperability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serilog-dnstap-interop
          path: |
            ${{ runner.temp }}/sink.fstrm
            ${{ runner.temp }}/file.jsonl
            ${{ runner.temp }}/tcp.jsonl
            ${{ runner.temp }}/tcp.stderr
          if-no-files-found: warn


  dns-collector-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NuGetPackageSourceCredentials_deltazulu-github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build sink package and restore isolated Serilog consumer
        run: |
          dotnet restore src/Serilog.Sinks.Dnstap/Serilog.Sinks.Dnstap.csproj --configfile NuGet.Config --locked-mode
          dotnet pack src/Serilog.Sinks.Dnstap/Serilog.Sinks.Dnstap.csproj -c Release --no-restore --output artifacts/packages /p:RepositoryCommit=${{ github.sha }}
          python3 .github/scripts/verify-nupkg.py artifacts/packages/Serilog.Sinks.Dnstap.*.nupkg
          dotnet restore tests/PackageConsumer/PackageConsumer.csproj --configfile tests/PackageConsumer/NuGet.Config --packages "${{ runner.temp }}/collector-consumer-cache" --no-http-cache
      - name: Download and verify pinned DNS-collector v3.3.7
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/DNS-collector_3.3.7_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/dmachard/DNS-collector/releases/download/v3.3.7/DNS-collector_3.3.7_linux_amd64.tar.gz
          echo "7f16a995e3be6d7bb46974722a3f1336cc589fbfff2c2c3c9c57c0b4cbedcbbe  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/collector-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/collector-bin"
          binary="$(find "$RUNNER_TEMP/collector-bin" -type f -name dnscollector -print -quit)"
          [[ -n "$binary" ]] || { echo "DNS-collector executable not found" >&2; exit 1; }
          chmod +x "$binary"
          echo "DNS_COLLECTOR_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Verify Serilog TCP and file output with DNS-collector
        shell: bash
        run: bash .github/interop/check-dns-collector.sh "$RUNNER_TEMP" "$DNS_COLLECTOR_BINARY"
      - name: Preserve DNS-collector interoperability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serilog-dns-collector-evidence
          path: |
            ${{ runner.temp }}/collector.yml
            ${{ runner.temp }}/config-check.log
            ${{ runner.temp }}/collector.log
            ${{ runner.temp }}/tcp.jsonl
            ${{ runner.temp }}/file.jsonl
            ${{ runner.temp }}/tap-watch/capture.fstrm
          if-no-files-found: warn

  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NuGetPackageSourceCredentials_deltazulu-github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore and build benchmark harness
        run: |
          dotnet restore benchmarks/Serilog.Sinks.Dnstap.Benchmarks/Serilog.Sinks.Dnstap.Benchmarks.csproj --configfile NuGet.Config --locked-mode
          dotnet build benchmarks/Serilog.Sinks.Dnstap.Benchmarks/Serilog.Sinks.Dnstap.Benchmarks.csproj -c Release --no-restore
      - name: Exercise file and TCP benchmark paths
        run: |
          set -euo pipefail
          dotnet run --project benchmarks/Serilog.Sinks.Dnstap.Benchmarks -c Release --no-build --no-restore -- tcp 1000 128 | tee tcp-smoke.txt
          dotnet run --project benchmarks/Serilog.Sinks.Dnstap.Benchmarks -c Release --no-build --no-restore -- file 1000 128 | tee file-smoke.txt
      - name: Preserve smoke measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-smoke
          path: |
            file-smoke.txt
            tcp-smoke.txt
          if-no-files-found: error
